{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | ElecCatalog Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #1a237e;
            --secondary-color: #3949ab;
            --accent-color: #00bcd4;
            --dark-bg: #0b1623;
            --card-bg: #1b2838;
            --text-light: #e0e1dd;
            --text-muted: #778da9;
            --border-color: #2a3f54;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0b1623 0%, #1a237e 50%, #0b1623 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo i {
            font-size: 3.5rem;
            color: var(--accent-color);
        }

        .login-logo h3 {
            font-weight: 800;
            color: #fff;
            margin-top: 0.5rem;
        }

        .login-logo p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group-custom {
            margin-bottom: 1.25rem;
        }

        .form-group-custom label {
            display: block;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        .form-control-custom {
            background: var(--dark-bg);
            border: 1px solid var(--border-color);
            color: var(--text-light);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            width: 100%;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .form-control-custom:focus {
            background: var(--dark-bg);
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 4px rgba(0,188,212,0.1);
            color: var(--text-light);
        }

        .form-control-custom::placeholder {
            color: var(--text-muted);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--accent-color), #008ba3);
            border: none;
            color: #fff;
            padding: 0.9rem;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,188,212,0.3);
        }

        .alert-custom {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .alert-error {
            background: rgba(231,76,60,0.15);
            border: 1px solid rgba(231,76,60,0.3);
            color: #e74c3c;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: var(--accent-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            animation: fadeIn 0.6s ease forwards;
        }
    </style>
</head>

<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <i class="bi bi-speedometer2"></i>
            <h3>لوحة التحكم</h3>
            <p>تسجيل الدخول إلى لوحة إدارة ElecCatalog</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="alert-custom alert-error">
                <i class="bi bi-exclamation-circle me-2"></i>{{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'dashboard:login' %}">
            {% csrf_token %}
            <div class="form-group-custom">
                <label>اسم المستخدم</label>
                {{ form.username }}
            </div>
            <div class="form-group-custom">
                <label>كلمة المرور</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-left ms-2"></i> تسجيل الدخول
            </button>
        </form>

        <div class="back-link">
            <a href="{% url 'catalog:home' %}"><i class="bi bi-arrow-right ms-1"></i> العودة إلى الموقع</a>
        </div>
    </div>
</div>

</body>
</html>
